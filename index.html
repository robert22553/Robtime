<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>輕鬆時光</title>
<style>
:root{--bg1:#ffe9f1;--bg2:#e3f4ff;--card:rgba(255,255,255,.78);--tx:#3b3355;--sub:#8a82a6;--a:#ff7eb6;--b:#7ac7ff;--c:#ffd666;--bd:rgba(255,255,255,.9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2140;--bg2:#1b2d45;--card:rgba(50,44,76,.8);--tx:#f6f0ff;--sub:#b6acd6;--bd:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a2140;--bg2:#1b2d45;--card:rgba(50,44,76,.8);--tx:#f6f0ff;--sub:#b6acd6;--bd:rgba(255,255,255,.12);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:hidden}
.bub{position:fixed;border-radius:50%;opacity:.35;filter:blur(2px);animation:fl 12s ease-in-out infinite;z-index:0;pointer-events:none}
.bub:nth-child(1){width:140px;height:140px;background:var(--a);left:-30px;top:10%}
.bub:nth-child(2){width:100px;height:100px;background:var(--c);right:-20px;top:40%;animation-delay:-4s}
.bub:nth-child(3){width:180px;height:180px;background:var(--b);left:30%;bottom:-60px;animation-delay:-8s}
@keyframes fl{50%{transform:translateY(-30px) scale(1.08)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.3rem;margin:0}
.btns{display:flex;gap:8px}
.ib{border:0;background:var(--card);border-radius:50%;width:44px;height:44px;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 12px rgba(120,90,160,.18);transition:transform .15s}
.ib:active{transform:scale(.9) rotate(-8deg)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:18px;margin-bottom:14px;backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(120,90,160,.15)}
.lb{font-size:.85rem;color:var(--sub);margin-bottom:6px}
.date{text-align:center}
.clock{font-size:clamp(2.8rem,15vw,5rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.dt{font-size:1.05rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.grid .card{margin:0}
.emo{font-size:2.4rem;display:inline-block;animation:bn 2s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-6px) rotate(6deg)}}
.name{font-size:1.5rem;font-weight:700;margin:2px 0}
.big{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--a)}
.sm{font-size:.9rem;color:var(--sub)}
.bar{height:12px;border-radius:9px;background:rgba(150,130,190,.2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--a));border-radius:9px;transition:width .3s}
.full{margin-top:14px}
.tm{text-align:center}
.tm .big{font-size:3rem;color:var(--b)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.bt{border:0;border-radius:20px;padding:10px 18px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),#ff9a76);box-shadow:0 4px 10px rgba(255,126,182,.35)}
.bt.g{background:var(--card);color:var(--tx);box-shadow:none;border:2px solid var(--bd)}
.bt.b{background:linear-gradient(135deg,var(--b),#8f9bff)}
.chip{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.ring{animation:rg .5s 6}
@keyframes rg{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
#ov{position:fixed;inset:0;background:rgba(40,30,70,.5);display:none;z-index:9;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.pn{background:var(--bg1);color:var(--tx);border-radius:26px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px}
.pn h2{margin:0 0 12px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
input,select{font:inherit;color:inherit;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 8px;min-width:0}
input[type=checkbox]{width:22px;height:22px}
.ar{display:grid;grid-template-columns:48px 1fr auto auto 36px;gap:6px;margin:6px 0;align-items:center}
.ar input[type=time]{width:92px}
@media(max-width:560px){.ar{grid-template-columns:44px 1fr 36px}.ar input[type=time]{width:100%}}
.x{border:0;background:none;font-size:1.2rem;cursor:pointer}
</style>
</head>
<body>
<div class="bub"></div><div class="bub"></div><div class="bub"></div>
<main>
<header>
<h1 id="ttl">🎈 輕鬆時光</h1>
<div class="btns"><button class="ib" id="snd" title="聲音開關">🔔</button><button class="ib" id="set" title="設定">⚙</button></div>
</header>

<section class="card date">
<div class="dt" id="dt"></div>
<div class="clock" id="clk">00:00:00</div>
</section>

<section class="grid">
<div class="card">
<div class="lb">🎯 現在的活動主題</div>
<span class="emo" id="cE">😴</span>
<div class="name" id="cN">—</div>
<div class="sm" id="cR"></div>
<div class="lb" style="margin-top:10px">⏳ 距離主題結束</div>
<div class="big" id="cC">--:--:--</div>
<div class="bar"><i id="cB"></i></div>
</div>
<div class="card" id="nxCard">
<div class="lb">🚀 下一個即將開始</div>
<span class="emo" id="nE">🌈</span>
<div class="name" id="nN">—</div>
<div class="sm" id="nR"></div>
<div class="lb" style="margin-top:10px">⏰ 距離開始還有</div>
<div class="big" id="nC">--:--:--</div>
</div>
</section>

<section class="card tm full">
<div class="lb">⏱ 倒數計時器</div>
<div class="big" id="tD">05:00</div>
<div class="row" id="pre"></div>
<div class="row"><button class="bt" id="tS">開始</button><button class="bt g" id="tR">重設</button></div>
</section>
</main>

<div id="ov"><div class="pn">
<h2>⚙ 設定</h2>
<div class="f"><label for="sT">網站標題</label><input id="sT" maxlength="20"></div>
<div class="f"><label for="sM">倒數計時預設（分鐘）</label><input id="sM" type="number" min="1" max="999" style="width:90px"></div>
<div class="f"><label for="sH">時間格式</label><select id="sH"><option value="0">24 小時制</option><option value="1">12 小時制</option></select></div>
<div class="f"><label for="sC">活動切換時叮咚</label><input type="checkbox" id="sC"></div>
<div class="f"><label for="sD">倒數結束時叮咚</label><input type="checkbox" id="sD"></div>
<div class="f"><label for="sTh">外觀</label><select id="sTh"><option value="auto">跟隨系統</option><option value="light">明亮</option><option value="dark">夜間</option></select></div>
<div class="f"><b>每日活動時間表</b><button class="bt g" id="tst">🔔 試聽</button></div>
<div class="sm">表情／名稱／開始／結束（結束早於開始表示跨日）</div>
<div id="list"></div>
<div class="row"><button class="bt b" id="add">＋ 新增活動</button></div>
<div class="row" style="margin-top:18px"><button class="bt" id="sv">儲存</button><button class="bt g" id="cl">取消</button><button class="bt g" id="rs">還原預設</button></div>
</div></div>

<script>
var DEF={title:'輕鬆時光',timerMin:5,h12:0,dc:true,dt:true,theme:'auto',acts:[
{e:'🌞',n:'早安活力',s:'07:00',t:'09:00'},{e:'📚',n:'專注學習',s:'09:00',t:'12:00'},{e:'🍱',n:'午餐放鬆',s:'12:00',t:'13:00'},
{e:'💡',n:'創意時間',s:'13:00',t:'15:00'},{e:'🧋',n:'下午茶',s:'15:00',t:'15:30'},{e:'🚀',n:'衝刺時間',s:'15:30',t:'18:00'},
{e:'🎮',n:'晚間悠閒',s:'18:00',t:'22:00'},{e:'😴',n:'晚安睡眠',s:'22:00',t:'07:00'}]};
var S,soundOn=true,$=function(i){return document.getElementById(i)};
function ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{S=JSON.parse(ld('tf_set'))}catch(e){S=null}
if(!S||!S.acts)S=JSON.parse(JSON.stringify(DEF));
soundOn=ld('tf_snd')!=='0';

var ac=null;
function ding(){
 if(!soundOn)return;
 try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  [[880,0],[660,.35]].forEach(function(p){
   var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+p[1];
   o.type='sine';o.frequency.value=p[0];o.connect(g);g.connect(ac.destination);
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
   o.start(t);o.stop(t+1.3);
  });
 }catch(e){}
}
document.addEventListener('click',function(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}},{once:true});

function p2(n){return(n<10?'0':'')+n}
function sec(h){var a=h.split(':');return(+a[0])*3600+(+a[1])*60}
function hms(s){s=Math.max(0,Math.floor(s));return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)}
function ms(s){s=Math.max(0,Math.ceil(s));return p2(Math.floor(s/60))+':'+p2(s%60)}
function hm(h){if(!S.h12)return h;var a=h.split(':'),x=+a[0];return(x<12?'上午 ':'下午 ')+(x%12||12)+':'+a[1]}

function apply(){
 $('ttl').textContent='🎈 '+S.title;document.title=S.title;
 var r=document.documentElement;
 if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
 $('snd').textContent=soundOn?'🔔':'🔕';
}
apply();

var lastKey=null;
function find(now){
 var cur=null,nx=null,best=1e9;
 S.acts.forEach(function(a,i){
  var s=sec(a.s),e=sec(a.t);if(e<=s)e+=86400;
  [now,now+86400].forEach(function(n){if(n>=s&&n<e&&!cur)cur={a:a,i:i,left:e-n,total:e-s}});
  var d=s-now;if(d<=0)d+=86400;
  if(d<best){best=d;nx={a:a,d:d}}
 });
 return{cur:cur,nx:nx};
}
var DAYS=['日','一','二','三','四','五','六'];
function tick(){
 var d=new Date(),now=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
 $('dt').textContent=d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日 星期'+DAYS[d.getDay()];
 var h=d.getHours(),pre=S.h12?(h<12?'上午 ':'下午 '):'';
 $('clk').textContent=pre+p2(S.h12?(h%12||12):h)+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
 var f=find(now),c=f.cur;
 if(c){
  $('cE').textContent=c.a.e;$('cN').textContent=c.a.n;$('cR').textContent=hm(c.a.s)+' – '+hm(c.a.t);
  $('cC').textContent=hms(c.left);$('cB').style.width=(100-c.left/c.total*100)+'%';
 }else{
  $('cE').textContent='🛋';$('cN').textContent='自由時間';$('cR').textContent='目前沒有安排';$('cC').textContent='--:--:--';$('cB').style.width='0';
 }
 if(f.nx){
  $('nE').textContent=f.nx.a.e;$('nN').textContent=f.nx.a.n;$('nR').textContent=hm(f.nx.a.s)+' 開始';$('nC').textContent=hms(f.nx.d);
 }else{$('nN').textContent='尚無活動';$('nC').textContent='--:--:--'}
 var key=c?c.i+':'+c.a.n:'none';
 if(lastKey!==null&&key!==lastKey){
  if(S.dc)ding();
  var el=$('cE');el.classList.remove('ring');void el.offsetWidth;el.classList.add('ring');
 }
 lastKey=key;
 tmTick();
}

// 倒數計時器
var T={run:false,left:S.timerMin*60,end:0};
function tmShow(){$('tD').textContent=ms(T.left);$('tS').textContent=T.run?'暫停':'開始'}
function tmTick(){
 if(T.run){
  T.left=(T.end-Date.now())/1000;
  if(T.left<=0){T.run=false;T.left=0;if(S.dt){ding();setTimeout(ding,1500)}}
 }
 tmShow();
}
$('tS').onclick=function(){
 if(T.run){T.run=false}
 else{if(T.left<=0)T.left=S.timerMin*60;T.end=Date.now()+T.left*1000;T.run=true}
 tmShow();
};
$('tR').onclick=function(){T.run=false;T.left=S.timerMin*60;tmShow()};
function presets(){
 var b=$('pre');b.innerHTML='';
 [1,5,10,25].forEach(function(m){
  var x=document.createElement('button');x.className='chip';x.textContent=m+' 分';
  x.onclick=function(){T.run=false;T.left=m*60;tmShow()};b.appendChild(x);
 });
}
presets();

// 聲音開關
$('snd').onclick=function(){soundOn=!soundOn;sv('tf_snd',soundOn?'1':'0');apply();if(soundOn)ding()};

// 設定
function row(a){
 var r=document.createElement('div');r.className='ar';
 r.innerHTML='<input class="e" maxlength="4"><input class="n" maxlength="14" placeholder="活動名稱"><input class="s" type="time"><input class="t" type="time"><button class="x" title="刪除">🗑</button>';
 r.querySelector('.e').value=a.e;r.querySelector('.n').value=a.n;r.querySelector('.s').value=a.s;r.querySelector('.t').value=a.t;
 r.querySelector('.x').onclick=function(){r.remove()};
 $('list').appendChild(r);
}
function openSet(){
 $('sT').value=S.title;$('sM').value=S.timerMin;$('sH').value=S.h12;$('sC').checked=S.dc;$('sD').checked=S.dt;$('sTh').value=S.theme;
 $('list').innerHTML='';S.acts.forEach(row);$('ov').classList.add('on');
}
$('set').onclick=openSet;
$('cl').onclick=function(){$('ov').classList.remove('on')};
$('add').onclick=function(){row({e:'⭐',n:'',s:'08:00',t:'09:00'})};
$('tst').onclick=function(){var o=soundOn;soundOn=true;ding();soundOn=o};
$('rs').onclick=function(){S=JSON.parse(JSON.stringify(DEF));sv('tf_set',JSON.stringify(S));apply();T.run=false;T.left=S.timerMin*60;lastKey=null;openSet()};
$('sv').onclick=function(){
 var acts=[];
 document.querySelectorAll('#list .ar').forEach(function(r){
  var n=r.querySelector('.n').value.trim(),s=r.querySelector('.s').value,t=r.querySelector('.t').value;
  if(n&&s&&t)acts.push({e:r.querySelector('.e').value||'⭐',n:n,s:s,t:t});
 });
 S={title:$('sT').value.trim()||'輕鬆時光',timerMin:Math.max(1,+$('sM').value||5),h12:+$('sH').value,dc:$('sC').checked,dt:$('sD').checked,theme:$('sTh').value,acts:acts};
 sv('tf_set',JSON.stringify(S));apply();
 if(!T.run){T.left=S.timerMin*60}
 lastKey=null;tick();$('ov').classList.remove('on');
};
tick();setInterval(tick,250);
</script>
</body>
</html>
